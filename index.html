#wel .wbox{text-align:center;padding:24px;animation:welpop .7s cubic-bezier(.2,.9,.3,1.2) both}
#wel .wlg{width:min(190px,48vw);aspect-ratio:1;margin:0 auto 14px;display:block}
#wel .wh{font-size:30px;font-weight:700;color:var(--ht,#1d4a68);letter-spacing:.5px}
#wel .wn{font-size:36px;font-weight:800;margin:6px 0;background:linear-gradient(120deg,#b8860b,#f6c32b,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;word-break:break-word;line-height:1.5}
#wel .wr{display:inline-block;margin-top:6px;padding:5px 16px;border-radius:99px;background:#ffffffaa;color:var(--ht,#1d4a68);font-weight:600;font-size:14px;box-shadow:0 2px 10px #0002}
@keyframes welin{from{opacity:0}to{opacity:1}}@keyframes welout{to{opacity:0;transform:scale(1.04)}}
@keyframes welpop{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}

/* v8.4 bottle media, rating modal, print 2-up landscape, slip header, chat */
.bt{height:230px;width:auto;max-width:46%;object-fit:contain}
.btv{border-radius:14px;filter:none!important;background:transparent}.wb{mix-blend-mode:multiply}
.disp-card{overflow-y:auto;-webkit-overflow-scrolling:touch}
#rv_prev img{max-width:100%;max-height:180px;object-fit:contain;border-radius:12px}
.sl-h{display:flex!important;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;direction:ltr}
.sl-h .pl{margin:0;flex:none;width:62px;height:62px;order:1}
.sl-h span{order:2;flex:1;font-size:11px;text-align:center;border:1px solid #000;border-radius:99px;padding:3px 8px;line-height:1.5;opacity:1}
.sl-h b{order:3;flex:none;display:block;font-size:26px;line-height:1.5}
.pg2{display:flex;gap:8mm;justify-content:center;align-items:flex-start;height:194mm;overflow:hidden;break-after:page;page-break-after:always}
.pg2:last-child{break-after:auto;page-break-after:auto}
.pg2 .slipp{flex:0 0 calc(50% - 4mm);max-width:calc(50% - 4mm);margin:0;border:0;padding:0;break-inside:avoid}
.pg2 .sl{max-width:none}
.pgs{height:194mm;overflow:hidden;break-after:page;page-break-after:always}
.chw{display:flex;flex-direction:column;gap:8px}
#chmsgs{height:min(56vh,460px);overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.chb{max-width:82%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 4px #0001}
.chb small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.chb.c{background:#e4f6e8;align-self:flex-start;border-bottom-left-radius:4px}
.chb.u{background:#dcecff;align-self:flex-end;border-bottom-right-radius:4px}
.chb.me.c,.chb.me.u{outline:2px solid #f6c32b66}
.chi{display:flex;gap:8px}.chi input{flex:1;min-width:0}
.cht{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px;cursor:pointer}
.cht b{flex:1;min-width:0}.cht .mu{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* v9.5 shopkeeper compact header, search, print meta, splash */
html[data-role=customer]{--hd1:#3f9ad6;--hd2:#1d5f99}
html[data-role=customer] #sbup,html[data-role=customer] #sbdn{display:none!important}
html[data-role=customer] header.bar{flex-wrap:wrap;gap:4px 8px;padding:6px 8px 6px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
html[data-role=customer] header.bar{display:grid;grid-template-columns:min(46vw,200px) minmax(0,1fr);align-items:center;gap:6px 8px}
html[data-role=customer] header.bar .logo{width:min(46vw,200px);margin:0;order:1;grid-column:1;grid-row:1 / span 3;justify-self:start}
html[data-role=customer] header.bar #hid{grid-column:1 / -1;grid-row:3}
html[data-role=customer] header.bar #hbw{order:4;min-width:0;padding:4px 2px 2px;margin:0;overflow:visible;flex-direction:column;align-items:stretch;gap:8px;grid-column:2;grid-row:2;justify-self:end;width:min(170px,100%)}
html[data-role=customer] header.bar #hmb{order:3;width:46px;height:46px;grid-column:2;grid-row:1;justify-self:end}
html[data-role=customer] header.bar .hdr-btns,html[data-role=customer] #hlo{display:none!important}
html[data-role=customer] .hbt{flex:none;width:100%;min-width:0;flex-direction:row;justify-content:flex-start;gap:8px;padding:10px 14px;font-size:14px;border-radius:14px}
html[data-role=customer] .hbt .si{font-size:19px}
#hid{order:5;flex:1 1 100%;display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;padding:0 4px;color:var(--ht);flex-wrap:wrap}
#hid b{font-size:15px}
#hid button{margin-inline-start:auto;padding:3px 10px;font-size:11px;border-radius:99px;background:#fff;color:#1d4a68;border:1px solid #0003;box-shadow:none}
header.bar .logo{cursor:pointer}
.pk{display:block;width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:12px;background:#111}
#hmb{position:relative}#hmb[data-n]::after{content:attr(data-n);position:absolute;top:-4px;inset-inline-end:-4px;background:#d93025;color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px}
#srch{position:fixed;inset:0;z-index:120;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 10px 10px}
#srch .sbx{width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;background:#fff;border-radius:18px;box-shadow:0 12px 40px #0006;overflow:hidden;color:#10283a}
#srch .shd{display:flex;gap:8px;padding:10px;border-bottom:1px solid #e3e3e3}
#srch .shd input{flex:1;min-width:0;font-size:16px}
#srch .sls{overflow:auto;padding:6px 10px 12px}
#srch .sg{font-size:12px;font-weight:700;color:#6b7b88;margin:10px 2px 4px}
#srch .si2{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#f3f7fa;margin:4px 0;cursor:pointer}
#srch .si2 small{display:block;color:#6b7b88;font-size:12px}
#srch .si2 b{flex:1;min-width:0}
.sl-meta{font-size:13px!important;flex-wrap:wrap;align-items:baseline;color:#000!important}
.sl-meta b{font-size:15px!important}
.sl-meta .m-dt{text-align:end}
#wel.splash{z-index:300}

/* v9.5 offer ticker */
#tkw{padding:0 12px;background:var(--bg,#fff)}
.tkr{direction:ltr;overflow:hidden;white-space:nowrap;border-radius:12px;background:var(--tkbg,#7a1020);color:var(--tkfg,#fff3c4);font-weight:700;font-size:14px;padding:8px 0;margin:8px 0 8px;box-shadow:0 2px 8px #0003}
.tkr span{display:inline-block;padding-left:100%;animation:tkl var(--tkd,20s) linear infinite;will-change:transform}
.tkr.r span{animation-name:tkr2}
.tkr:active span{animation-play-state:paused}
@keyframes tkl{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@keyframes tkr2{from{transform:translateX(-100%)}to{transform:translateX(0)}}

 const tot=Math.max(1,rec.length),pDl=Math.round(dlv*100/tot),pCa=Math.round(canc.length*100/tot);
 const C=2*Math.PI*46,dl=(dlv/tot)*C,dc=(canc.length/tot)*C;

/* Local store for extended order info (courier, tracking, timestamps) */
const DS_KEY=()=>"aab_dispatch_"+S.i;
function getDSMap(){try{return JSON.parse(localStorage.getItem(DS_KEY())||"{}")}catch(e){return{}}}
function saveDSMap(m){try{localStorage.setItem(DS_KEY(),JSON.stringify(m))}catch(e){}}
function getDSInfo(oid){return getDSMap()[oid]||{}}
function setDSInfo(oid,patch){const m=getDSMap();m[oid]={...(m[oid]||{}),...patch};saveDSMap(m)}

/* Extended status flow: approved → dispatched → shipped → delivered */
const FULL_FLOW=["new","submitted","approved","dispatched","shipped","delivered"];
const STATUS_ICON={"new":"🆕","submitted":"📤","approved":"✅","dispatched":"📦","shipped":"🚚","delivered":"🎉","rejected":"❌","cancelled":"🚫"};

/* Override the trk() tracker to support extended flow */
function trkFull(o){
  const st_=o.status;
  const bad=st_==="rejected"||st_==="cancelled";
  const ds=getDSInfo(o.id);
  const flow=["new","submitted","approved","dispatched","shipped","delivered"];
  const si=bad?2:Math.max(0,flow.indexOf(st_));
  const last_=bad?st_:"delivered";
  return `<div class="trk2">${flow.map((k,j)=>{
    const on=j<=si&&!bad||(bad&&j<=2);
    const bd2=bad&&j===2;
    return `<div class="tk2 ${on?"on":""} ${bd2?"bd":""}"><i></i><small>${STATUS_ICON[bad&&j===2?st_:k]||""} ${t(k)||k}</small></div>`;
  }).join("")}</div>`;
}

/* Dispatch modal */
function showDispatchModal(oid,nextStatus){
  const isDisp=nextStatus==="dispatched";
  const isShip=nextStatus==="shipped";
  const isDel=nextStatus==="delivered";
  const ds=getDSInfo(oid);
  const title=isDel?t("del_h"):isShip?t("ship_h"):t("disp_h");
  const note=isDel?t("del_note"):isShip?t("ship_note"):t("disp_note");
  const html=`<div class="disp-modal" id="dsp_modal">
    <div class="disp-card">
      <h2 style="margin-top:0">${title}</h2>
      <div class="mu" style="margin-bottom:12px">${note}</div>
      ${!isDel?`<label>${t("courier_name")}</label>
      <input id="dsp_courier" value="${ds.courier||""}" placeholder="TCS, Leopard, M&P...">
      <label>${t("tracking_no")}</label>
      <input id="dsp_tracking" dir="ltr" value="${ds.tracking||""}" placeholder="Optional">`:``}
      <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px">
        <button class="no" onclick="closeDispModal()">✖ ${L==="ur"?"منسوخ":"Cancel"}</button>
        <button class="ok" onclick="confirmDispatch('${oid}','${nextStatus}')">${isDel?"✅ "+t("deliver_btn"):isShip?"🚚 "+t("ship_btn"):"📦 "+t("dispatch_btn")}</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML("beforeend",html);
}
function closeDispModal(){const m=document.getElementById("dsp_modal");if(m)m.remove()}

async function confirmDispatch(oid,nextStatus){
  const isDel=nextStatus==="delivered";
  const isDisp=nextStatus==="dispatched";
  const courier=(document.getElementById("dsp_courier")||{}).value||"";
  const tracking=(document.getElementById("dsp_tracking")||{}).value||"";
  closeDispModal();
  /* Save courier info locally */
  const now=Date.now();
  const patch={};
  if(!isDel){if(courier)patch.courier=courier.trim();if(tracking)patch.tracking=tracking.trim();}
  if(nextStatus==="dispatched")patch.dispAt=now;
  if(nextStatus==="shipped")patch.shipAt=now;
  if(nextStatus==="delivered")patch.delAt=now;
  setDSInfo(oid,patch);
  /* Update status via existing setS — but first try direct RPC with new status */
  try{
    const ok=await rpc("aab_set_status",{p_role:S.r,p_id:S.i,p_h:S.h,p_oid:oid,p_status:nextStatus});
    await refresh();render(true);
    const msgKey=isDel?"al_del":nextStatus==="shipped"?"al_ship":"al_disp";
    toast(t(msgKey)+oid,4000);
    /* Push notification */
    pushNotif(t(msgKey)+oid,STATUS_ICON[nextStatus]||"📦");
  }catch(e){
    /* Fallback: store status locally so UI updates even if DB doesn't have new column */
    setDSInfo(oid,{localStatus:nextStatus,...patch});
    await refresh();render(true);
    toast((L==="ur"?"اسٹیٹس محفوظ ہو گیا (لوکل)":"Status saved locally")+": "+nextStatus,4000);
  }
}

window.card=function(o,btns){
  btns=btns||"";

  return _origCard(o,btns);
};

let _notifEnabled=false;

async function requestNotifPerm(){
  if(!("Notification" in window))return toast(L==="ur"?"یہ براؤزر نوٹیفیکیشن سپورٹ نہیں کرتا":"Notifications not supported");
  const p=await Notification.requestPermission();
  _notifEnabled=p==="granted";
  render(true);
  if(_notifEnabled)toast(L==="ur"?"نوٹیفیکیشن آن ہو گئی ✔":"Notifications enabled ✔");
  else toast(L==="ur"?"نوٹیفیکیشن بند رہی":"Notification permission denied");
}

function checkNotifState(){
  if(!("Notification" in window))return false;
  _notifEnabled=Notification.permission==="granted";
  return _notifEnabled;
}

function pushNotif(msg,icon="🌿"){
  checkNotifState();
  if(!_notifEnabled||!("Notification" in window))return;

}

/* ═══════════════════════════════════════════════════
   LIVE LOCATION SYSTEM
   ═══════════════════════════════════════════════════ */
let _locEnabled=false,_locData=null,_locWatch=null;

async function requestLocation(){
  if(!navigator.geolocation)return toast(L==="ur"?"یہ ڈیوائس لوکیشن سپورٹ نہیں کرتی":"Location not supported");
  navigator.geolocation.getCurrentPosition(pos=>{
    _locEnabled=true;
    _locData={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy),ts:Date.now()};
    revGeocode(_locData.lat,_locData.lng);
    startLocWatch();
    render(true);
    toast(L==="ur"?"لوکیشن آن ✔":"Location enabled ✔");
  },err=>{
    _locEnabled=false;
    toast(L==="ur"?"لوکیشن نہیں ملی: "+err.message:"Location error: "+err.message,5000);
    render(true);
  },{enableHighAccuracy:true,timeout:15000});
}

function startLocWatch(){
  if(_locWatch)return;
  if(!navigator.geolocation)return;
  _locWatch=navigator.geolocation.watchPosition(pos=>{
    _locData={..._locData,lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy),ts:Date.now()};
    revGeocode(_locData.lat,_locData.lng);
  },err=>{},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}

async function revGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=14`,{headers:{"Accept-Language":L==="ur"?"ur":"en"}});
    const j=await r.json();
    const city=j.address?.city||j.address?.town||j.address?.village||j.address?.county||"";
    const state=j.address?.state||"";
    if(_locData)_locData.city=city+(state?" · "+state:"");
  }catch(e){}
}

/* Device info */
function getDeviceInfo(){
  const ua=navigator.userAgent;
  const mob=/Mobile|Android|iPhone|iPad/.test(ua);
  const browser=/Chrome\//.test(ua)?"Chrome":/Firefox\//.test(ua)?"Firefox":/Safari\//.test(ua)?"Safari":"Browser";
  const os=/Android/.test(ua)?"Android":/iPhone|iPad/.test(ua)?"iOS":/Windows/.test(ua)?"Windows":"Other";
  return `${mob?"📱":"💻"} ${os} · ${browser}`;
}

  if(yes&&r==="ok"){const after=((st.tokAdm||[]).find(x=>x.cid===q.o.cid)||{}).bal;if(before!=null&&after!=null&&after<=before)return toast(t("tq_nl"),9000)}
  toast(!yes?t("tq_rej"):r==="dup"?t("tq_dup"):t("tq_done"),6000)
}catch(e){toast(errMsg(e),7000)}}
async function rvRemove(oid){try{if(!await confirmBox(t("tq_rmq")))return;const r=await rpc("aab_rv_remove",{p_id:S.i,p_h:S.h,p_oid:oid});if(r!=="ok")return toast(t(r==="nosql"?"tq_nosql":"bad"),6000);await refresh();render(true);toast(t("done"))}catch(e){toast(e&&e.status===404?t("tq_nosql"):errMsg(e),8000)}}
async function tokAdjust(){try{const c=(document.getElementById("ta_c")||{}).value,a=Math.trunc(+((document.getElementById("ta_a")||{}).value)||0);if(!c||!a)return toast(t("tk_bad"));
  const r=await rpc("aab_tok_adjust",{p_id:S.i,p_h:S.h,p_cid:c,p_amt:a,p_note:""});if(r!=="ok")return toast(t(r==="nosql"?"tq_nosql":"tq_nl"),8000);await refresh();render(true);toast(t("done"))}catch(e){toast(e&&e.status===404?t("tq_nosql"):errMsg(e),8000)}}
async function tokqTest(){const R=[],chk=async(lb,fn,a,ok)=>{try{const r=await rpc(fn,a);R.push((ok(r)?"✅ ":"⚠️ ")+lb)}catch(e){R.push("❌ "+lb+(e&&e.status?" ("+e.status+")":""))}};
  await chk("decisions (admin check)","aab_tok_decisions",{p_id:S.i,p_h:S.h},r=>Array.isArray(r));
  let meta=null;await chk("ledger found","aab_tok_diag",{p_id:S.i,p_h:S.h},r=>{meta=r&&r.ledger;return !!(meta&&meta.tbl&&meta.cust)});
  toast("v"+BUILD+"\n"+R.join("\n")+(meta?"\n"+meta.tbl+" / "+meta.cust:""),14000)}
function tokQTab(){

async function chPoll(){
 if(CH.busy||!S.r||!S.h||SEC[S.r]!=="chat")return;CH.busy=1;
 try{
  if(S.r!=="customer"&&!CH.cid){
   const th=await rpc("aab_chat_threads",{p_role:S.r,p_id:S.i,p_h:S.h}),box=document.getElementById("chth");
   if(box&&Array.isArray(th))box.innerHTML=th.length?th.map(x=>`<div class="cht" onclick="chOpen('${esc(x.cid)}','${esc((x.name||"").replace(/'/g,""))}')"><span style="font-size:22px">🏪</span><b>${esc(x.name||x.cid)}<div class="mu">${esc(x.last_body||"")}</div></b><span class="mu" dir="ltr">${chT(x.last_ts)}</span></div>`).join(""):`<div class="empty">${AE("No chats yet","ابھی کوئی چیٹ نہیں")}</div>`;
  }else{
   const cid=chCid(),box=document.getElementById("chmsgs");if(!box||!cid)return;
   const r=await rpc("aab_chat_list",{p_role:S.r,p_id:S.i,p_h:S.h,p_cid:cid,p_after:CH.last});
   if(Array.isArray(r)){
    if(!CH.last)box.innerHTML="";
    if(r.length){const near=box.scrollHeight-box.scrollTop-box.clientHeight<90||!CH.last;box.insertAdjacentHTML("beforeend",r.map(chBub).join(""));CH.last=r[r.length-1].id;if(near)box.scrollTop=box.scrollHeight}
    else if(!CH.last)box.innerHTML=`<div class="empty">${AE("No messages yet","ابھی کوئی پیغام نہیں")}</div>`}}
 }catch(e){}finally{CH.busy=0}}

  if(!ok)return toast(AE("Message not sent","پیغام نہیں بھیجا جا سکا"),4000);i.value="";const em=document.querySelector("#chmsgs .empty");if(em){em.remove();}chPoll()}catch(e){toast(errMsg(e),6000)}}
